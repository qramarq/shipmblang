# Contribution-only OpenIDEA plugin. Language files use the same format as
# OpenIDEA languages/*.toml. This package has no WASM component.
id = "shipmblang"
name = "ShipMBLang"
version = "0.6.0"
description = "Language support for .shipmb, .smb, and .shiplang: file detection, # comments, and the shipmblang language server."
authors = ["ZMachinery LLC"]
homepage = "https://github.com/qramarq/shipmblang"
change-notes = "0.6.0 — language file for .shipmb, .smb, and .shiplang. On OpenIDEA 0.1.33 copy it into the user languages directory; the plugin list alone does not start shipmblang lsp."
openidea-api = "0.1"

[[contributes.languages]]
path = "languages/shipmblang.toml"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiplm"
version = "0.1.0"
description = "ShipLM: a small ShipMBLang-native model, with compiler-verified data and evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ZMachinery LLC" }]
# The compiler is the oracle. Model 0.1.x targets the 0.5 grammar.
dependencies = ["shipmblang>=0.5,<0.6"]

[project.optional-dependencies]
train = ["numpy>=1.24.0", "tokenizers>=0.19.0", "torch>=2.0.0", "tqdm>=4.65.0", "datasets>=2.14.0"]
onnx = ["numpy>=1.24.0", "tokenizers>=0.19.0", "onnx", "onnxruntime"]
test = ["pytest"]

[project.scripts]
shiplm = "shiplm.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shiplm", "shiplm.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

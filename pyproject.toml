[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipmblang"
version = "0.1.0"
description = "Natural language programming layer for ShipMB with deterministic compilation to ShipMBLang bytecode."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "ZMachinery LLC" }]
keywords = ["shiplang", "shipmblang", "shipmb", "printurf", "mcp", "vscode", "errors"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
model = [
    "numpy>=1.24.0",
    "tokenizers>=0.19.0",
    "torch>=2.0.0",
]
train = [
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "tokenizers>=0.19.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
]

[project.scripts]
shipmblang = "shipmblang.cli:main"
shipmb = "shipmblang.cli:main"
shipmb-printurf = "shipmblang.error_explainer:main"
shipmb-mcp = "shipmblang.mcp_server:main"
shipmb-compile = "shipmblang.natural_syntax:main"
shipmb-run = "shipmblang.natural_syntax:run_main"
shipmblang-mcp = "shipmblang.mcp_server:main"
shipmblang-compile = "shipmblang.natural_syntax:main"
shipmblang-run = "shipmblang.natural_syntax:run_main"
shipmblang-onboarding = "shipmblang.onboarding:main"
printurf = "shipmblang.error_explainer:main"
shiplang-mcp = "shipmblang.mcp_server:main"
shiplang-compile = "shipmblang.natural_syntax:main"
shiplang-run = "shipmblang.natural_syntax:run_main"
shipmb-onboarding = "shipmblang.onboarding:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["driplm*", "shiplang*", "shipmblang*", "shipmb*", "driplang*"]

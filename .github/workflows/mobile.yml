name: Mobile
on:
  push:
    paths: ['apps/mobile/**', 'shipmblang/mobile_service.py', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', 'shipmblang/mobile_service.py', '.github/workflows/mobile.yml']
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run export

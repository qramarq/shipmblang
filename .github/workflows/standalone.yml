name: Standalone executable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds an artifact only. This workflow does not create a GitHub Release.
jobs:
  executable:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test the Ratatui editor
        run: cargo test --locked --manifest-path shipmblang/native/ratatui-editor/Cargo.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.22.3"
          python -m pip install -e .

      - name: Build standalone executable
        run: python tools/build_standalone.py --require-editor

      - name: Record executable size
        shell: bash
        run: ls -lh dist/shipmblang dist/shipmblang.exe 2>/dev/null || true

      - name: Smoke test without Python on PATH
        shell: bash
        run: bash tools/smoke_standalone.sh

      - name: Verify setup check, dry-run, and install
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: bash tools/verify_setup.sh

      - name: Stage executable and installers
        shell: bash
        run: |
          mkdir -p dist/package
          if [ -f dist/shipmblang.exe ]; then cp -f dist/shipmblang.exe dist/package/shipmblang.exe; fi
          if [ -f dist/shipmblang ] && [ ! -f dist/shipmblang.exe ]; then cp -f dist/shipmblang dist/package/shipmblang; fi
          cp -f tools/install.sh tools/install.ps1 dist/package/
          chmod 755 dist/package/install.sh
          ls -lh dist/package

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: shipmblang-${{ runner.os }}-${{ runner.arch }}
          path: dist/package/*
          if-no-files-found: error
